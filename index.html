<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekend Checklist</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weekend">
<meta name="theme-color" content="#0d0820">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Sora:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}

/* Two themes on one page. Weekend = disco night (dark glass panels). Weekdays = daylight (sky header, white cards). */
body{
  --bg:#0d0820; --ink:#f6f2ff; --muted:#b5a9d6; --panel:rgba(255,255,255,.06); --panel-line:rgba(255,255,255,.14);
  --rule:rgba(255,255,255,.08); --field:rgba(0,0,0,.25); --track:rgba(255,255,255,.1); --on:#0d0820;
  --head-ink:#f6f2ff; --head-muted:#b5a9d6; --chip:rgba(255,255,255,.08); --sheet:#1d1340;
  --pink:#ff4fb3; --gold:#ffd166; --cyan:#4fe3ff; --violet:#9b6bff;
  --check-bg:conic-gradient(from 30deg,var(--cyan),var(--violet),var(--pink),var(--gold),var(--cyan));
  --bar:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--gold));
  --display:"Monoton","Impact","Arial Black",sans-serif;
  --body:"Sora",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
  background:
    radial-gradient(120% 60% at 50% -10%, #3a1670 0%, transparent 60%),
    radial-gradient(80% 50% at 100% 40%, rgba(255,79,179,.18) 0%, transparent 60%),
    radial-gradient(80% 50% at 0% 80%, rgba(79,227,255,.14) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 56px;
  transition:background-color .3s;
}
html{background:#0d0820}
#flecks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);align-self:center;width:100%;max-width:340px}
.tabs button{flex:1;font:inherit;font-size:14px;font-weight:600;padding:9px 12px;border-radius:999px;border:0;background:transparent;color:var(--head-muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--head-ink);color:var(--bg)}

header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--head-ink)}
.hang{width:2px;height:22px;background:linear-gradient(var(--head-muted),transparent);opacity:.6;margin-bottom:-12px}
#ball{width:150px;height:150px;max-width:100%;filter:drop-shadow(0 0 24px rgba(155,107,255,.55))}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1.05;margin:4px 0 0;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--gold),var(--pink) 45%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.sub{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--head-muted);font-weight:600}

.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:4px}
.nav button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--head-ink);border-radius:999px;width:42px;height:42px;font-size:20px;cursor:pointer;flex:none}
.range{font-weight:600;flex:1;font-variant-numeric:tabular-nums}
.range small{display:block;font-weight:400;color:var(--head-muted);font-size:13px}
.meter{width:100%;display:flex;flex-direction:column;gap:6px}
.progress{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--bar);transition:width .4s}
body:not([data-tab="wd"]) .progress span{box-shadow:0 0 12px var(--pink)}
.count{font-size:13px;color:var(--head-muted);font-variant-numeric:tabular-nums}

#days{display:flex;flex-direction:column;gap:14px}
.day{--hue:var(--pink);background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.day[data-day="fri"]{--hue:var(--gold)} .day[data-day="sat"]{--hue:var(--pink)} .day[data-day="sun"]{--hue:var(--cyan)} .day[data-day="any"]{--hue:var(--violet)}
.day.today{border-color:var(--hue);box-shadow:0 0 0 1px var(--hue),0 0 28px -6px var(--hue)}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.dayhead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;color:var(--hue)}
.dayhead .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--on);background:var(--hue);padding:3px 9px;border-radius:999px}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
li:first-child{border-top:0}
li.divider{padding:6px 0 2px;border-top:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
li label{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;margin:0;border-radius:50%;cursor:pointer;
  border:2px solid var(--panel-line);background:transparent;display:grid;place-content:center;transition:transform .15s,background .2s}
body:not([data-tab="wd"]) li input[type=checkbox]{border-color:rgba(255,255,255,.3)}
li input[type=checkbox]:checked{border-color:transparent;background:var(--check-bg)}
body:not([data-tab="wd"]) li input[type=checkbox]:checked{box-shadow:0 0 14px -2px var(--hue)}
li input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
li input[type=checkbox]:active{transform:scale(.9)}
.text{overflow-wrap:anywhere}
li.is-done .text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--hue)}
.from{display:inline-block;margin-left:8px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--hue);border:1px solid var(--hue);border-radius:999px;padding:1px 7px;flex:none;opacity:.85}
.move{flex:none;font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--panel-line);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.del{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;width:32px;height:32px;cursor:pointer;flex:none;border-radius:8px}
li.is-moved .text{color:var(--muted);opacity:.6;flex:1;min-width:0}
li.is-moved .note{font-size:12px;color:var(--muted);flex:none}
.undo{flex:none;font:inherit;font-size:12px;font-weight:700;color:var(--hue);background:none;border:0;padding:4px 6px;cursor:pointer}
li.empty{color:var(--muted);font-size:14px}

.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.add input[type=text]{flex:1 1 180px;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--panel-line);border-radius:12px;background:var(--field);color:var(--ink)}
.add input[type=text]::placeholder{color:var(--muted)}
.add .row{display:flex;gap:10px;align-items:center}
.repeat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.repeat input{accent-color:var(--hue);width:16px;height:16px}
.add button{font:inherit;font-weight:700;padding:10px 18px;border-radius:12px;border:0;background:var(--hue);color:var(--on);cursor:pointer}

/* Move sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,3,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--sheet);color:var(--ink);border-radius:22px 22px 0 0;border:1px solid var(--panel-line);border-bottom:0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow-y:auto}
.sheet h3{margin:0;font-size:17px;font-weight:700}
.sheet h3 span{color:var(--muted);font-weight:500}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:12px;border:1px solid var(--panel-line);background:var(--chip);color:var(--ink);cursor:pointer;min-width:56px}
.cancel{font:inherit;font-weight:600;padding:12px;border-radius:12px;border:0;background:transparent;color:var(--muted);cursor:pointer}

input:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.status{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.progress span,li input[type=checkbox],body{transition:none}}
/* ---- Weekdays: calm and polished. Deep navy night-blue ground, cream cards, gold hairlines, jewel-tone day names, analog clock header ---- */
body[data-tab="wd"]{
  --bg:#13203a; --ink:#1b2638; --muted:#6b7385; --panel:#fbf7ee; --panel-line:#e6dcc6;
  --rule:#ece4d2; --field:#ffffff; --track:rgba(244,236,216,.16); --on:#fbf7ee;
  --head-ink:#f4ecd8; --head-muted:rgba(244,236,216,.66); --chip:#ffffff; --sheet:#fbf7ee;
  --gold:#c9a45c;
  --check-bg:var(--hue);
  --bar:linear-gradient(90deg,#b88f45,#e2c37f);
  --display:"Cormorant Garamond","Iowan Old Style","Palatino",Georgia,serif;
  color-scheme:light;
  background:radial-gradient(90% 50% at 50% 0%,#1f3157 0%,transparent 70%),var(--bg);background-attachment:scroll;
}
html:has(body[data-tab="wd"]){background:#13203a}
body[data-tab="wd"] .tabs{background:rgba(244,236,216,.06);border:1px solid rgba(201,164,92,.45)}
body[data-tab="wd"] .tabs button{color:var(--head-muted)}
body[data-tab="wd"] .tabs button[aria-selected="true"]{background:var(--gold);color:#13203a}
body[data-tab="wd"] .hang{visibility:hidden}
body[data-tab="wd"] #ball{width:160px;height:160px;filter:none}
body[data-tab="wd"] h1{font-weight:500;font-style:italic;letter-spacing:.005em;font-size:clamp(36px,10.5vw,50px);background:none;color:var(--head-ink);margin:0}
body[data-tab="wd"] .sub{color:var(--gold);letter-spacing:.3em}
body[data-tab="wd"] .nav button{background:transparent;border:1px solid rgba(201,164,92,.5);color:var(--head-ink)}
body[data-tab="wd"] .progress{height:4px;border-radius:2px}
body[data-tab="wd"] .count{letter-spacing:.02em}
body[data-tab="wd"] .day{border:1px solid var(--panel-line);border-radius:14px;box-shadow:0 14px 30px -18px rgba(0,0,0,.55);-webkit-backdrop-filter:none;backdrop-filter:none;padding:18px 18px 16px}
body[data-tab="wd"] .day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 14px 30px -18px rgba(0,0,0,.55)}
.day[data-day="mon"]{--hue:#8c3a3f} .day[data-day="tue"]{--hue:#2e6153} .day[data-day="wed"]{--hue:#8a6528} .day[data-day="thu"]{--hue:#2f4f86} .day[data-day="wany"]{--hue:#5d4b80}
body[data-tab="wd"] .dayhead{padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:4px}
body[data-tab="wd"] .dayhead h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:27px;letter-spacing:0;line-height:1.1;min-width:0}
body[data-tab="wd"] .dayhead .meta{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
body[data-tab="wd"] .pill{background:transparent;color:var(--hue);border:1px solid var(--hue);font-size:10px}
body[data-tab="wd"] li input[type=checkbox]{border:1.5px solid #b9b0a0;width:24px;height:24px}
body[data-tab="wd"] li input[type=checkbox]:checked{background:var(--hue);border-color:var(--hue)}
body[data-tab="wd"] li.is-done .text{text-decoration-color:var(--muted)}
body[data-tab="wd"] li.divider{color:var(--gold);letter-spacing:.2em}
body[data-tab="wd"] .kind{border-color:rgba(0,0,0,.18);color:var(--muted);opacity:1}
body[data-tab="wd"] .move{border-color:#d9cfba;color:var(--ink);background:#ffffff}
body[data-tab="wd"] .add input[type=text]{border-color:#e0d6c1}
body[data-tab="wd"] .add button{border-radius:10px;font-weight:600}
body[data-tab="wd"] .repeat input{accent-color:var(--hue)}
body[data-tab="wd"] .scrim{background:rgba(10,16,30,.5)}
body[data-tab="wd"] .sheet h3{font-family:var(--display);font-style:italic;font-weight:600;font-size:24px}
body[data-tab="wd"] .chips button{border-color:#d9cfba}
body[data-tab="wd"] .grp-title{color:#8a6528}
body[data-tab="wd"] .status{color:var(--head-muted)}
body[data-tab="wd"] input:focus-visible,body[data-tab="wd"] button:focus-visible{outline:2px solid var(--gold)}
</style>
</head>
<body>
<canvas id="flecks" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Which list">
    <button role="tab" id="tab-we" aria-selected="true">Weekend</button>
    <button role="tab" id="tab-wd" aria-selected="false">Weekdays</button>
  </div>
  <header>
    <div class="hang" aria-hidden="true"></div>
    <canvas id="ball" width="300" height="300" role="img" aria-label="Spinning disco ball"></canvas>
    <div class="sub" id="headline">This weekend</div>
    <h1 id="title">Weekend Checklist</h1>
    <div class="nav">
      <button id="prev" aria-label="Previous">‹</button>
      <div class="range" id="range"></div>
      <button id="next" aria-label="Next">›</button>
    </div>
    <div class="meter">
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
      <div class="count" id="count"></div>
    </div>
  </header>
  <main id="days"></main>
  <div class="status" id="status">Saved on this device.</div>
</div>
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title"></h3>
    <div id="sheet-groups" style="display:flex;flex-direction:column;gap:16px"></div>
    <button class="cancel" id="sheet-cancel">Cancel</button>
  </div>
</div>

<script>
/* ---------- Disco ball + light flecks ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const ball=document.getElementById("ball"),bx=ball.getContext("2d");
const fl=document.getElementById("flecks"),fx=fl.getContext("2d");
const BANDS=14,COLORS=["#ff4fb3","#4fe3ff","#ffd166","#9b6bff"];
const sparkle=[];for(let i=0;i<BANDS*40;i++)sparkle.push(Math.random());
function drawBall(rot){
  const W=300,R=128,cx=150,cy=150;bx.clearRect(0,0,W,W);
  const g=bx.createRadialGradient(cx-40,cy-50,10,cx,cy,R);g.addColorStop(0,"#d9d3ee");g.addColorStop(.6,"#6d6390");g.addColorStop(1,"#241a45");
  bx.fillStyle=g;bx.beginPath();bx.arc(cx,cy,R,0,Math.PI*2);bx.fill();
  const L=[-.45,-.55,.7];const ln=Math.hypot(...L);
  for(let i=0;i<BANDS;i++){
    const phi=-Math.PI/2+(i+.5)*Math.PI/BANDS;const ring=Math.cos(phi);
    const n=Math.max(6,Math.round(ring*40));const dPhi=Math.PI/BANDS;
    for(let j=0;j<n;j++){
      const th=(j+.5)/n*Math.PI*2+rot;
      const x=ring*Math.sin(th),y=Math.sin(phi),z=ring*Math.cos(th);
      if(z<=0.05)continue;
      const dTh=Math.PI*2/n;
      const w=R*ring*dTh*z*.86,h=R*dPhi*Math.cos(phi)*.86+R*dPhi*.0;
      const px=cx+x*R,py=cy+y*R;
      const lit=Math.max(0,(x*L[0]+y*L[1]+z*L[2])/ln);
      const s=sparkle[(i*40+j)%sparkle.length];
      const flick=Math.sin(rot*6+s*40);
      let shade=40+lit*170+s*30;
      bx.fillStyle=`rgb(${shade|0},${(shade*.95)|0},${Math.min(255,shade*1.12)|0})`;
      if(lit>.82&&flick>.7){bx.fillStyle="#ffffff"}
      else if(s>.93&&flick>.3){bx.fillStyle=COLORS[(i+j)%4]}
      bx.fillRect(px-w/2,py-h/2,Math.max(1,w-1),Math.max(1,h*.9));
    }
  }
  const hl=bx.createRadialGradient(cx-48,cy-56,0,cx-48,cy-56,40);hl.addColorStop(0,"rgba(255,255,255,.85)");hl.addColorStop(1,"rgba(255,255,255,0)");
  bx.fillStyle=hl;bx.beginPath();bx.arc(cx,cy,R,0,Math.PI*2);bx.fill();
}
let flecks=[];
function sizeFlecks(){const d=devicePixelRatio||1;fl.width=innerWidth*d;fl.height=innerHeight*d;fx.setTransform(d,0,0,d,0,0);
  flecks=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:1+Math.random()*2.5,
    c:COLORS[Math.random()*4|0],v:.15+Math.random()*.45,p:Math.random()*6.28}))}
function drawFlecks(t){fx.clearRect(0,0,innerWidth,innerHeight);
  for(const f of flecks){
    if(!reduce){f.x+=f.v;if(f.x>innerWidth+10)f.x=-10}
    const a=reduce?.35:.2+.5*(.5+.5*Math.sin(t/500+f.p));
    fx.globalAlpha=a;fx.fillStyle=f.c;fx.beginPath();fx.arc(f.x,f.y,f.r,0,Math.PI*2);fx.fill();
  }fx.globalAlpha=1}
sizeFlecks();addEventListener("resize",sizeFlecks);


/* ---------- Moon + starry sky for the weekday tab ---------- */
function star(c,x,y,r,pts){c.beginPath();for(let i=0;i<pts*2;i++){const a=i*Math.PI/pts-Math.PI/2,rad=i%2?r*.38:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath();c.fill()}
const HSTARS=[[62,70,13,.0],[238,58,10,1.7],[252,190,8,3.1],[48,206,7,4.4],[205,248,6,2.2],[96,262,5,5.3],[150,30,6,.9]];
function drawMoon(t){
  const c=bx;c.clearRect(0,0,300,300);
  // soft halo
  const halo=c.createRadialGradient(150,150,40,150,150,130);halo.addColorStop(0,"rgba(226,195,127,.28)");halo.addColorStop(1,"rgba(226,195,127,0)");
  c.fillStyle=halo;c.beginPath();c.arc(150,150,130,0,Math.PI*2);c.fill();
  // crescent: full disc minus offset disc
  c.save();
  const g=c.createLinearGradient(90,90,200,220);g.addColorStop(0,"#f6e3b0");g.addColorStop(1,"#c9a45c");
  c.beginPath();c.arc(150,150,78,0,Math.PI*2);c.clip();
  c.fillStyle=g;c.beginPath();c.rect(60,60,180,180);c.arc(186,128,70,0,Math.PI*2);c.fill("evenodd");
  c.restore();
  // twinkling stars
  for(const [x,y,r,p] of HSTARS){const tw=reduce?1:.55+.45*Math.sin(t/700+p);c.globalAlpha=.35+.65*tw;c.fillStyle="#f4e2b2";star(c,x,y,r*(.85+.15*tw),4)}
  c.globalAlpha=1;
}
let sky=[];
function sizeSky(){sky=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.5+Math.random()*1.3,p:Math.random()*6.28,s:.6+Math.random()*1.4,big:Math.random()<.06}))}
function drawSky(t){fx.clearRect(0,0,innerWidth,innerHeight);
  for(const d of sky){const tw=reduce?.6:.5+.5*Math.sin(t/(900*d.s)+d.p);fx.globalAlpha=.15+.55*tw;
    if(d.big){fx.fillStyle="#f4e2b2";star(fx,d.x,d.y,3.5+tw*1.5,4)}else{fx.fillStyle="#f4ecd8";fx.beginPath();fx.arc(d.x,d.y,d.r,0,Math.PI*2);fx.fill()}}
  fx.globalAlpha=1}
sizeSky();addEventListener("resize",sizeSky);

let TAB="we";
function frame(t){
  if(TAB==="we"){drawBall(t/2600);drawFlecks(t)}else{drawMoon(t);drawSky(t)}
  if(!reduce)requestAnimationFrame(frame);
}

/* ---------- Data ---------- */
const BOARDS={
  we:{name:"Weekend",title:"Weekend Checklist",secs:[
    {key:"fri",name:"Friday",short:"Fri",offset:0,defaults:[["shabbat","Shabbat"],["workout","Workout"],["walk","Walk"],["pt","PT exercises"]]},
    {key:"sat",name:"Saturday",short:"Sat",offset:1,defaults:[["workout","Workout"],["walk","Walk"],["pt","PT exercises"],["groceries","Groceries"]]},
    {key:"sun",name:"Sunday",short:"Sun",offset:2,defaults:[["walk","Walk"],["pt","PT exercises"],["nathan","Nathan"],["parents","Call Mom & Dad"],["shower","Super shower"],["linens","Change linens"]]},
    {key:"any",name:"Sometime this weekend",short:"Anytime",offset:null,defaults:[]}]},
  wd:{name:"Weekdays",title:"Weekday Checklist",secs:[
    {key:"mon",name:"Monday",short:"Mon",offset:0,defaults:[]},
    {key:"tue",name:"Tuesday",short:"Tue",offset:1,defaults:[]},
    {key:"wed",name:"Wednesday",short:"Wed",offset:2,defaults:[]},
    {key:"thu",name:"Thursday",short:"Thu",offset:3,defaults:[]},
    {key:"wany",name:"Sometime this week",short:"Anytime",offset:null,defaults:[]}]}
};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fromIso=s=>new Date(s+"T00:00:00");
const fmt=d=>`${MON[d.getMonth()]} ${d.getDate()}`;
const uid=()=>Math.random().toString(36).slice(2,10);

const today=new Date();today.setHours(0,0,0,0);
const dow=today.getDay();
const isWeekendNow=dow===5||dow===6||dow===0;
const thisFri=isWeekendNow?addDays(today,-{5:0,6:1,0:2}[dow]):addDays(today,5-dow);
const thisMon=isWeekendNow?addDays(thisFri,3):addDays(thisFri,-4);
const anchors={we:new Date(thisFri),wd:new Date(thisMon)};
const homeAnchor={we:thisFri,wd:thisMon};

const local={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){setStatus("Couldn't save. Check that this browser allows website data.")}}};
function setStatus(t){document.getElementById("status").textContent=t}
const docKey=(b,a)=>b==="we"?"wk:w"+iso(a):"wd:"+iso(a);
const recurKey=b=>b==="we"?"wk:recurring":"wd:recurring";
function norm(b,d){d=d||{};const a=d.added||{};const added={};BOARDS[b].secs.forEach(s=>added[s.key]=Array.isArray(a[s.key])?a[s.key]:[]);
  return{done:d.done||{},moved:d.moved||{},added}}
function normR(b,d){d=d||{};const r={};BOARDS[b].secs.forEach(s=>r[s.key]=Array.isArray(d[s.key])?d[s.key]:[]);return r}
const loadDoc=(b,a)=>norm(b,local.get(docKey(b,a)));
const saveDoc=(b,a,doc)=>local.set(docKey(b,a),doc);
let doc,recur;
function loadCurrent(){doc=loadDoc(TAB,anchors[TAB]);recur=normR(TAB,local.get(recurKey(TAB)))}

/* ---------- Moving ---------- */
function secOf(b,k){return BOARDS[b].secs.find(s=>s.key===k)}
function laterSecs(b,fromKey){
  const secs=BOARDS[b].secs;const days=secs.filter(s=>s.offset!=null);const any=secs.find(s=>s.offset==null);
  const src=secOf(b,fromKey);
  if(src.offset==null)return days;
  return [...days.filter(s=>s.offset>src.offset),any];
}
function moveGroups(sec){
  const a=anchors[TAB];
  const opts=(b,anc,secs,prefix,anyLabel)=>secs.map(s=>({b,a:anc,sec:s.key,chip:s.offset==null?"Anytime":s.short,label:s.offset==null?anyLabel:prefix+s.short}));
  if(TAB==="we"){
    const mon=addDays(a,3),nf=addDays(a,7);
    return[
      {title:"This weekend",opts:opts("we",a,laterSecs("we",sec.key),"","anytime this weekend")},
      {title:`Weekdays · ${fmt(mon)}–${fmt(addDays(mon,3))}`,opts:opts("wd",mon,BOARDS.wd.secs,"","this week")},
      {title:`Next weekend · ${fmt(nf)}–${fmt(addDays(nf,2))}`,opts:opts("we",nf,BOARDS.we.secs,"next ","next weekend")}
    ];
  }
  const fr=addDays(a,4),nm=addDays(a,7);
  return[
    {title:"This week",opts:opts("wd",a,laterSecs("wd",sec.key),"","anytime this week")},
    {title:`Weekend · ${fmt(fr)}–${fmt(addDays(fr,2))}`,opts:opts("we",fr,BOARDS.we.secs,"","the weekend")},
    {title:`Next week · ${fmt(nm)}–${fmt(addDays(nm,3))}`,opts:opts("wd",nm,BOARDS.wd.secs,"next ","next week")}
  ];
}
function sameDoc(b,a){return b===TAB&&iso(a)===iso(anchors[TAB])}
function moveItem(sec,it,o){
  const id=uid();const entry={id,text:it.text,from:sec.offset==null?BOARDS[TAB].name:sec.short};
  if(sameDoc(o.b,o.a)){doc.added[o.sec]=[...doc.added[o.sec],entry]}
  else{const d=loadDoc(o.b,o.a);d.added[o.sec].push(entry);saveDoc(o.b,o.a,d)}
  delete doc.done[it.key];
  doc.moved[it.key]={b:o.b,a:iso(o.a),sec:o.sec,id,label:o.label};
  saveDoc(TAB,anchors[TAB],doc);render();
}
function undoMove(key){
  const m=doc.moved[key];if(!m)return;
  const b=m.b||"we",a=fromIso(m.a||m.wk),s=m.sec||m.day;
  if(sameDoc(b,a)){doc.added[s]=(doc.added[s]||[]).filter(x=>x.id!==m.id);delete doc.done["a-"+m.id]}
  else{const d=loadDoc(b,a);d.added[s]=d.added[s].filter(x=>x.id!==m.id);delete d.done["a-"+m.id];saveDoc(b,a,d)}
  delete doc.moved[key];saveDoc(TAB,anchors[TAB],doc);render();
}
const scrim=document.getElementById("scrim");let lastFocus=null;
function openSheet(sec,it){
  lastFocus=document.activeElement;
  const t=document.getElementById("sheet-title");t.textContent="";t.append("Move “"+it.text+"” ");const sp=document.createElement("span");sp.textContent="to…";t.append(sp);
  const box=document.getElementById("sheet-groups");box.innerHTML="";
  moveGroups(sec).forEach(g=>{if(!g.opts.length)return;
    const grp=el("div","grp");grp.append(el("div","grp-title",g.title));const chips=el("div","chips");
    g.opts.forEach(o=>{const c=el("button",null,o.chip);c.setAttribute("aria-label",`Move to ${o.label}`);c.addEventListener("click",()=>{closeSheet();moveItem(sec,it,o)});chips.append(c)});
    grp.append(chips);box.append(grp)});
  scrim.hidden=false;box.querySelector("button")?.focus();
}
function closeSheet(){scrim.hidden=true;lastFocus?.focus?.()}
document.getElementById("sheet-cancel").onclick=closeSheet;
scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!scrim.hidden)closeSheet()});

/* ---------- Render ---------- */
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function itemsFor(sec){
  const out=sec.defaults.map(([id,t])=>({key:`d-${sec.key}-${id}`,text:t,kind:"standing"}));
  recur[sec.key].forEach(r=>out.push({key:"r-"+r.id,text:r.text,kind:"weekly",id:r.id}));
  doc.added[sec.key].forEach(a=>out.push({key:"a-"+a.id,text:a.text,kind:"once",id:a.id,from:a.from}));
  return out;
}
function row(sec,it){
  const li=el("li");const moved=doc.moved[it.key];
  if(moved){
    li.className="is-moved";
    li.append(el("span","text",it.text),el("span","note","Moved to "+moved.label));
    const u=el("button","undo","Undo");u.setAttribute("aria-label",`Undo moving ${it.text}`);
    u.addEventListener("click",()=>undoMove(it.key));li.append(u);return li;
  }
  const isDone=!!doc.done[it.key];if(isDone)li.className="is-done";
  const lab=el("label");const cb=el("input");cb.type="checkbox";cb.id=`cb-${TAB}-${it.key}`;cb.checked=isDone;
  cb.addEventListener("change",()=>{if(cb.checked)doc.done[it.key]=true;else delete doc.done[it.key];saveDoc(TAB,anchors[TAB],doc);render()});
  const txt=el("span","text");txt.append(document.createTextNode(it.text));if(it.from)txt.append(el("span","from","from "+it.from));
  lab.append(cb,txt);li.append(lab);
  if(it.kind!=="once")li.append(el("span","kind","Weekly"));
  if(!isDone){const mv=el("button","move","Move");mv.setAttribute("aria-label",`Not done: move ${it.text}`);mv.addEventListener("click",()=>openSheet(sec,it));li.append(mv)}
  if(it.kind!=="standing"){
    const b=el("button","del","×");b.setAttribute("aria-label",it.kind==="weekly"?`Remove ${it.text} from every week`:`Remove ${it.text}`);
    b.addEventListener("click",()=>{delete doc.done[it.key];
      if(it.kind==="weekly"){recur[sec.key]=recur[sec.key].filter(r=>r.id!==it.id);local.set(recurKey(TAB),recur)}
      else{doc.added[sec.key]=doc.added[sec.key].filter(a=>a.id!==it.id)}
      saveDoc(TAB,anchors[TAB],doc);render()});
    li.append(b);
  }
  return li;
}
function render(){
  const B=BOARDS[TAB],a=anchors[TAB];
  document.body.dataset.tab=TAB;
  document.getElementById("tab-we").setAttribute("aria-selected",TAB==="we");
  document.getElementById("tab-wd").setAttribute("aria-selected",TAB==="wd");
  document.getElementById("title").textContent=B.title;
  document.getElementById("ball").setAttribute("aria-label",TAB==="we"?"Spinning disco ball":"Crescent moon and stars");
  const last=addDays(a,TAB==="we"?2:3);
  const diff=Math.round((a-homeAnchor[TAB])/864e5/7);const unit=TAB==="we"?"weekend":"week";
  document.getElementById("headline").textContent=diff===0?`This ${unit}`:diff===1?`Next ${unit}`:diff===-1?`Last ${unit}`:diff>0?`${diff} ${unit}s ahead`:`${-diff} ${unit}s ago`;
  document.getElementById("range").innerHTML=`${fmt(a)} – ${fmt(last)}<small>${a.getFullYear()}</small>`;
  document.getElementById("prev").setAttribute("aria-label",`Previous ${unit}`);
  document.getElementById("next").setAttribute("aria-label",`Next ${unit}`);
  const todayIso=iso(today);
  const main=document.getElementById("days");main.innerHTML="";
  let total=0,done=0;
  B.secs.forEach(sec=>{
    const date=sec.offset==null?null:addDays(a,sec.offset);
    const isToday=date&&iso(date)===todayIso;
    const items=itemsFor(sec);
    const open=items.filter(it=>!doc.moved[it.key]&&!doc.done[it.key]);
    const fin=items.filter(it=>!doc.moved[it.key]&&doc.done[it.key]);
    const moved=items.filter(it=>doc.moved[it.key]);
    total+=open.length+fin.length;done+=fin.length;
    const s=el("section","day"+(isToday?" today":""));s.dataset.day=sec.key;
    const pill=(open.length+fin.length)&&!open.length?'<span class="pill">All done</span>':isToday?'<span class="pill">Today</span>':"";
    s.innerHTML=`<div class="dayhead"><h2>${sec.name}</h2><span class="meta">${pill}<span>${date?fmt(date):"Any day"}</span></span></div>`;
    const ul=el("ul");
    if(!items.length)ul.append(el("li","empty",sec.offset==null?`Nothing yet. Add anything that can happen any day this ${unit}.`:"Nothing yet."));
    open.forEach(it=>ul.append(row(sec,it)));
    if(fin.length&&open.length)ul.append(el("li","divider","Done"));
    fin.forEach(it=>ul.append(row(sec,it)));
    if(moved.length)ul.append(el("li","divider","Moved"));
    moved.forEach(it=>ul.append(row(sec,it)));
    s.append(ul);
    const form=el("form","add");const lbl=sec.offset==null?`this ${unit}`:sec.name;
    form.innerHTML=`<input type="text" id="add-${TAB}-${sec.key}" placeholder="Add to ${lbl}…" aria-label="Add an item to ${lbl}" autocomplete="off"><div class="row"><label class="repeat"><input type="checkbox" id="rep-${TAB}-${sec.key}">Every week</label><button type="submit">Add</button></div>`;
    form.addEventListener("submit",e=>{e.preventDefault();const inp=form.querySelector("input[type=text]");const t=inp.value.trim();if(!t)return;
      if(form.querySelector(".repeat input").checked){recur[sec.key]=[...recur[sec.key],{id:uid(),text:t}];local.set(recurKey(TAB),recur)}
      else{doc.added[sec.key]=[...doc.added[sec.key],{id:uid(),text:t}];saveDoc(TAB,anchors[TAB],doc)}
      inp.value="";render();document.getElementById(`add-${TAB}-${sec.key}`).focus()});
    s.append(form);main.append(s);
  });
  document.getElementById("bar").style.width=total?`${done/total*100}%`:"0";
  document.getElementById("count").textContent=done===total&&total?`All ${total} done. Nice work!`:`${done} of ${total} done`;
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=TAB==="we"?"#0d0820":"#13203a";
}
function setTab(t){if(t===TAB&&doc)return;TAB=t;loadCurrent();render();scrollTo(0,0);if(reduce)frame(0)}
document.getElementById("tab-we").onclick=()=>setTab("we");
document.getElementById("tab-wd").onclick=()=>setTab("wd");
document.getElementById("prev").onclick=()=>{anchors[TAB]=addDays(anchors[TAB],-7);loadCurrent();render()};
document.getElementById("next").onclick=()=>{anchors[TAB]=addDays(anchors[TAB],7);loadCurrent();render()};

TAB=isWeekendNow?"we":"wd";loadCurrent();render();
requestAnimationFrame(frame);
</script>
</body>
</html>
